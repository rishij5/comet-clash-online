<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07070f">
<title>Comet Clash Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --c: #8d83d6; --c-rgb: 141,131,214;
    --bg: #07070f; --fg: #eef0ff; --dim: rgba(205,210,255,.62);
    --font: "Orbitron", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--fg); font-family: var(--font);
    background:
      radial-gradient(120% 70% at 50% 120%, rgba(var(--c-rgb), .22), transparent 60%),
      radial-gradient(80% 50% at 50% -20%, rgba(70, 90, 255, .14), transparent 70%),
      var(--bg);
    overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    transition: background .4s;
  }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
  .screen.show { display: flex; }

  /* ---------- join ---------- */
  #join { align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
  #join h1 {
    margin: 0 0 4px; font-size: clamp(30px, 9vw, 44px); font-weight: 900; letter-spacing: .06em;
    background: linear-gradient(90deg, #ff4f6d, #46b3ff 40%, #4dffa0 70%, #ffc93d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #join p { margin: 0; color: var(--dim); font-size: 13px; letter-spacing: .08em; }
  #code {
    width: 240px; font: 900 42px var(--font); text-align: center; letter-spacing: .35em; text-transform: uppercase;
    padding: 12px 0 12px .35em; border-radius: 18px; border: 2px solid rgba(120,130,255,.5);
    background: rgba(18,18,42,.9); color: #fff; outline: none;
    box-shadow: 0 0 0 6px rgba(70,90,255,.08), inset 0 2px 10px rgba(0,0,0,.4);
    -webkit-user-select: text; user-select: text; touch-action: manipulation;
  }
  #code:focus { border-color: #46b3ff; box-shadow: 0 0 0 6px rgba(70,179,255,.18); }
  #err { color: #ffc93d; min-height: 1.3em; font-size: 12px; letter-spacing: .04em; }
  .big {
    font: 800 18px var(--font); letter-spacing: .14em; padding: 16px 48px; border-radius: 16px; border: 0;
    background: linear-gradient(180deg, #6cc4ff, #2f8fe0); color: #06060d; touch-action: manipulation;
    box-shadow: 0 8px 24px rgba(47,143,224,.35), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .big:active { transform: translateY(1px) scale(.98); }

  /* ---------- controller ---------- */
  #bar {
    display: flex; align-items: center; gap: 12px; margin: calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
    padding: 10px 14px; border-radius: 16px;
    background: rgba(16,16,36,.78); border: 1px solid rgba(var(--c-rgb), .35);
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
    transition: border-color .3s, box-shadow .3s;
  }
  #ship { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 0 6px rgba(var(--c-rgb), .8)); }
  #who { font-weight: 900; font-size: 15px; letter-spacing: .12em; color: var(--c); white-space: nowrap; }
  #status { flex: 1; text-align: center; font-size: 12px; letter-spacing: .06em; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pips { display: flex; gap: 4px; flex: none; }
  #pips i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid rgba(var(--c-rgb), .7); }
  #pips i.on { background: var(--c); border-color: var(--c); box-shadow: 0 0 6px var(--c); }
  #net { width: 8px; height: 8px; border-radius: 50%; background: #ff5e57; flex: none; box-shadow: 0 0 8px #ff5e57; }
  #net.ok { background: #4dffa0; box-shadow: 0 0 8px #4dffa0; }

  #btns {
    flex: 1; display: flex; gap: 12px;
    padding: 12px calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  }
  .btn {
    position: relative; overflow: hidden; flex: 1; border-radius: 28px;
    touch-action: none; -webkit-user-select: none; user-select: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(180deg, rgba(var(--c-rgb), .16), rgba(var(--c-rgb), .04) 70%);
    border: 2px solid rgba(var(--c-rgb), .55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -30px 60px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.35);
    color: var(--fg); transition: transform .06s, background .12s, box-shadow .12s, opacity .3s;
  }
  .btn svg { width: clamp(54px, 18vmin, 120px); height: auto; stroke: var(--c); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
             filter: drop-shadow(0 0 10px rgba(var(--c-rgb), .5)); transition: stroke .12s; }
  .btn b { font-weight: 900; letter-spacing: .18em; font-size: clamp(18px, 5.5vmin, 34px); }
  .btn small { font-size: clamp(9px, 2.4vmin, 12px); letter-spacing: .14em; color: var(--dim); font-weight: 600; }
  .btn.on {
    transform: scale(.975);
    background: linear-gradient(180deg, rgba(var(--c-rgb), .95), rgba(var(--c-rgb), .7));
    box-shadow: 0 0 0 4px rgba(var(--c-rgb), .18), 0 0 50px rgba(var(--c-rgb), .55), inset 0 1px 0 rgba(255,255,255,.35);
    color: #07070f;
  }
  .btn.on svg { stroke: #07070f; filter: none; }
  .btn.on small { color: rgba(7,7,15,.7); }
  .ripple { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; pointer-events: none;
            background: rgba(255,255,255,.55); animation: rip .45s ease-out forwards; }
  @keyframes rip { to { transform: scale(9); opacity: 0; } }

  /* states */
  #pad.pilot #bar { border-color: #ffb347; box-shadow: 0 0 0 3px rgba(255,179,71,.18), 0 6px 24px rgba(0,0,0,.35); animation: warn 1s ease-in-out infinite; }
  @keyframes warn { 50% { box-shadow: 0 0 0 6px rgba(255,179,71,.06), 0 6px 24px rgba(0,0,0,.35); } }
  #pad.out .btn, #pad.wait .btn { opacity: .28; }
  #msg {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    pointer-events: none; text-align: center;
  }
  #msg .pop { font-size: clamp(30px, 10vmin, 64px); font-weight: 900; letter-spacing: .1em; color: #fff;
              text-shadow: 0 0 24px rgba(var(--c-rgb), .9), 0 4px 18px #000; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
</style>
</head>
<body>
<div id="join" class="screen">
  <h1>COMET CLASH</h1>
  <p>ENTER THE ROOM CODE SHOWN ON THE TV</p>
  <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Room code">
  <div id="err"></div>
  <button class="big" id="go">JOIN</button>
</div>

<div id="pad" class="screen wait">
  <div id="bar">
    <svg id="ship" viewBox="-16 -16 32 32" aria-hidden="true"><path d="M13 0 L2 -5 L-4 -10 L-9 -10 L-6 -3.5 L-8 0 L-6 3.5 L-9 10 L-4 10 L2 5 Z" fill="var(--c)" transform="rotate(-90)"/></svg>
    <div id="who">…</div>
    <div id="status">Connecting…</div>
    <div id="pips"></div><div id="net"></div>
  </div>
  <div id="btns">
    <div class="btn" id="turn">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M38 24a14 14 0 1 1-4.1-9.9"/><path d="M36 6v9h-9"/></svg>
      <b>TURN</b><small>HOLD · DOUBLE-TAP TO DASH</small>
    </div>
    <div class="btn" id="fire">
      <svg id="fireIcon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="6"/><path d="M24 4v8M24 36v8M4 24h8M36 24h8"/></svg>
      <b id="fireLabel">FIRE</b><small id="fireHint">TAP TO SHOOT</small>
    </div>
  </div>
  <div id="msg"></div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="ice-config.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let room = (params.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
let token = '';
try { token = localStorage.getItem('cc.token') || ''; } catch (e) {}
if (!token) { token = Math.random().toString(36).slice(2) + Date.now().toString(36); try { localStorage.setItem('cc.token', token); } catch (e) {} }

const ICON_FIRE = '<circle cx="24" cy="24" r="6"/><path d="M24 4v8M24 36v8M4 24h8M36 24h8"/>';
const ICON_JET = '<path d="M24 6c6 8 10 13 10 20a10 10 0 0 1-20 0c0-4 2-7 4-9 0 4 2 6 4 6-1-6 0-11 2-17z"/>';

let ws = null, retryT = null, kicked = false, lastMode = '';
const held = { turn: false, fire: false };
// 'ws' = server.py relay; 'p2p' = straight to the game screen over WebRTC (static hosting like GitHub Pages)
let mode = params.get('p') === '1' || /\.github\.io$/.test(location.hostname) ? 'p2p' : 'ws';
const P2P_PREFIX = 'comet-clash-v1-';
let peer = null, conn = null, joinedRoom = '', seq = 0, tc = 0, fc = 0, lastSq = 0, hbT = null, echoT = null;

function show(id) { for (const s of document.querySelectorAll('.screen')) s.classList.toggle('show', s.id === id); }
function send(o) {
  if (mode === 'p2p') { if (conn && conn.open) try { conn.send(o); } catch (e) {} }
  else if (ws && ws.readyState === 1) ws.send(JSON.stringify(o));
}
// Button state goes out the instant it changes, with a sequence number and running press counts so the
// game can use messages in any order and never miss a tap. A repeat follows 40 ms later and a heartbeat
// keeps going (every 100 ms while a button is down), so a lost packet is covered fast.
function sendInput() {
  if (mode !== 'p2p') return send({ t: 'in', ...held });
  send({ t: 'in', s: ++seq, tc, fc, ...held });
  clearTimeout(echoT); echoT = setTimeout(() => send({ t: 'in', s: ++seq, tc, fc, ...held }), 40);
}
function heartbeat() {
  clearTimeout(hbT);
  if (mode === 'p2p' && conn && conn.open) send({ t: 'in', s: ++seq, tc, fc, ...held });
  hbT = setTimeout(heartbeat, held.turn || held.fire ? 100 : 1000);
}
function setStatus(t) { $('status').textContent = t; }
function setColor(hex) {
  const n = parseInt(hex.slice(1), 16);
  document.documentElement.style.setProperty('--c', hex);
  document.documentElement.style.setProperty('--c-rgb', `${n >> 16 & 255},${n >> 8 & 255},${n & 255}`);
  document.querySelector('meta[name=theme-color]').content = '#07070f';
}
function setMode(mode) {
  const pad = $('pad');
  pad.classList.toggle('pilot', mode === 'pilot');
  pad.classList.toggle('out', mode === 'out');
  pad.classList.toggle('wait', mode === 'wait');
  if (mode === lastMode) return;
  lastMode = mode;
  const pilot = mode === 'pilot';
  $('fireIcon').innerHTML = pilot ? ICON_JET : ICON_FIRE;
  $('fireLabel').textContent = pilot ? 'JET' : 'FIRE';
  $('fireHint').textContent = pilot ? 'HOLD TO FLY' : 'TAP TO SHOOT';
}
function setPips(score, target) {
  const el = $('pips'); el.innerHTML = '';
  if (!target) return;
  for (let i = 0; i < target; i++) { const d = document.createElement('i'); if (i < score) d.className = 'on'; el.append(d); }
}

function connect() {
  clearTimeout(retryT);
  if (mode === 'p2p') return p2pConnect();
  if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
  let opened = false;
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onopen = () => { opened = true; $('net').classList.add('ok'); send({ t: 'join', room, token }); };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (_) { return; } onMsg(m); };
  ws.onclose = () => {
    $('net').classList.remove('ok');
    if (kicked) return;
    if (!opened) { mode = 'p2p'; return connect(); } // no relay here: static hosting, go peer-to-peer
    setStatus('Reconnecting…'); setMode('wait');
    retryT = setTimeout(connect, 1000);
  };
}
function iceConfig() {
  const t = window.CC_TURN || {};
  const iceServers = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }];
  if (t.username && t.credential) iceServers.push({
    urls: ['turn:relay1.expressturn.com:3478?transport=udp', 'turn:relay1.expressturn.com:3478?transport=tcp', 'turns:relay1.expressturn.com:443?transport=tcp'],
    username: t.username, credential: t.credential,
  });
  return t.username ? { iceServers } : undefined; // undefined = PeerJS defaults
}
function peerOpts() {
  const h = params.get('peerhost');
  const config = iceConfig();
  if (!h) return config ? { debug: 0, config } : { debug: 0 };
  const [host, port] = h.split(':');
  return { debug: 0, ...(config ? { config } : {}), host, port: +port || 443, secure: location.protocol === 'https:' && host !== 'localhost', path: '/' };
}
function p2pRetry(ms) {
  $('net').classList.remove('ok');
  if (kicked) return;
  setStatus('Reconnecting…'); setMode('wait');
  clearTimeout(retryT); retryT = setTimeout(connect, ms);
}
function p2pConnect() {
  if (!window.Peer) {
    if (document.readyState !== 'complete') return addEventListener('load', connect, { once: true });
    return setStatus('Couldn’t load the connection library. Check your internet.');
  }
  if (conn) { const c = conn; conn = null; try { c.close(); } catch (e) {} }
  if (!peer || peer.destroyed) {
    peer = new Peer(peerOpts());
    peer.on('error', err => {
      if (err.type === 'peer-unavailable') { // no game screen with that code
        clearTimeout(retryT); conn = null;
        if (joinedRoom === room) { setStatus('Waiting for the game screen…'); setMode('wait'); retryT = setTimeout(connect, 2000); return; } // TV reloading
        show('join'); $('code').value = room; $('err').textContent = `No game found with code ${room}. Check the TV.`;
      } else if (!conn || !conn.open) { peer.destroy(); p2pRetry(1500); }
    });
    peer.on('disconnected', () => { if (!peer.destroyed && !(conn && conn.open)) { peer.destroy(); p2pRetry(1000); } });
  }
  if (!peer.open) return peer.once('open', p2pDial);
  p2pDial();
}
function p2pDial() {
  // reliable:false = unordered channel: a lost packet never holds up the presses behind it
  const c = peer.connect(P2P_PREFIX + room, { reliable: false, serialization: 'json' });
  conn = c; seq = 0; tc = 0; fc = 0; lastSq = 0;
  const giveUp = setTimeout(() => { if (conn === c && !c.open) { try { c.close(); } catch (e) {} conn = null; p2pRetry(500); } }, 12000);
  c.on('open', () => {
    clearTimeout(giveUp);
    if (conn !== c) return;
    $('net').classList.add('ok'); joinedRoom = room;
    send({ t: 'join', room, token });
    heartbeat();
  });
  c.on('data', m => { if (conn === c && m && typeof m === 'object') onMsg(m); });
  const lost = () => { clearTimeout(giveUp); if (conn !== c) return; conn = null; p2pRetry(1000); };
  c.on('close', lost);
  c.on('error', lost);
  c.on('iceStateChanged', s => { if (s === 'failed' || s === 'closed') lost(); });
}

function onMsg(m) {
  if (m.t === 'noroom') {
    if (ws) { ws.onclose = null; ws.close(); }
    show('join'); $('code').value = room; $('err').textContent = `No game found with code ${m.room || room}. Check the TV.`;
  } else if (m.t === 'nohost') {
    show('pad'); setStatus('Waiting for the game screen…'); setMode('wait');
  } else if (m.t === 'hostback') {
    setStatus('Game screen is back');
  } else if (m.t === 'full') {
    show('pad'); setStatus(m.msg || 'Game is full'); $('who').textContent = 'WAITING'; setMode('wait');
  } else if (m.t === 'kicked') {
    kicked = true; setStatus('Removed by the host'); setMode('wait');
    const box = $('msg'); box.innerHTML = '';
    const b = document.createElement('button'); b.className = 'big'; b.textContent = 'REJOIN';
    b.onclick = () => { kicked = false; box.innerHTML = ''; box.style.pointerEvents = 'none'; connect(); };
    box.style.pointerEvents = 'auto'; box.append(b);
  } else if (m.t === 'status') {
    if (m.sq != null) { if (m.sq <= lastSq) return; lastSq = m.sq; } // peer-to-peer can reorder
    show('pad');
    setColor(m.color);
    $('who').textContent = m.name + (m.team ? ' · ' + m.team.replace('TEAM ', '') : '');
    setStatus(m.text || '');
    setPips(m.score, m.target);
    setMode(m.mode === 'lobby' || m.mode === 'pause' || m.mode === 'roundEnd' ? 'ship' : m.mode);
    if (m.buzz && navigator.vibrate) navigator.vibrate(m.buzz === 'hit' ? [80, 40, 80] : m.buzz === 'out' ? 300 : m.buzz === 'win' ? [60, 60, 60, 60, 200] : 30);
    if (m.buzz === 'hit') flash('SHIP DOWN!'); else if (m.buzz === 'out') flash('OUT!'); else if (m.buzz === 'win') flash('WINNER!');
  }
}
let flashT = null;
function flash(t) {
  if (kicked) return;
  const box = $('msg'); box.style.pointerEvents = 'none';
  box.innerHTML = `<div class="pop">${t}</div>`;
  clearTimeout(flashT); flashT = setTimeout(() => { if (!kicked) box.innerHTML = ''; }, 1200);
}

// buttons: pointer events handle multi-touch (one thumb per button)
function bind(el, key) {
  const down = e => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    const r = el.getBoundingClientRect(), rp = document.createElement('span');
    rp.className = 'ripple'; rp.style.left = (e.clientX - r.left) + 'px'; rp.style.top = (e.clientY - r.top) + 'px';
    el.append(rp); setTimeout(() => rp.remove(), 500);
    if (!held[key]) { held[key] = true; if (key === 'turn') tc++; else fc++; el.classList.add('on'); sendInput(); heartbeat(); if (navigator.vibrate) navigator.vibrate(8); }
    keepAwake();
  };
  const up = () => {
    if (held[key]) { held[key] = false; el.classList.remove('on'); sendInput(); }
  };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
}
bind($('turn'), 'turn');
bind($('fire'), 'fire');
document.addEventListener('contextmenu', e => e.preventDefault());
setInterval(() => { if (mode === 'ws') send({ t: 'ping' }); }, 10000); // keeps the connection alive while idle (Funnel/proxies cut quiet ones)
// iOS Safari ignores user-scalable=no, so block the zoom gestures directly.
// Pointer events above still fire; only the browser's own double-tap/pinch handling is cancelled.
const keepNative = el => !!(el && el.closest && el.closest('input, button'));
document.addEventListener('touchstart', e => { if (!keepNative(e.target)) e.preventDefault(); }, { passive: false });
document.addEventListener('touchend', e => { if (!keepNative(e.target)) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
for (const g of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(g, e => e.preventDefault(), { passive: false });

// keep the phone screen on while playing (where supported)
let lock = null;
async function keepAwake() {
  if (lock || !('wakeLock' in navigator)) return;
  try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { held.turn = held.fire = false; sendInput(); for (const b of document.querySelectorAll('.btn')) b.classList.remove('on'); }
});

function start(code) {
  room = code;
  history.replaceState(null, '', `?room=${room}`);
  $('err').textContent = '';
  show('pad'); setStatus('Connecting…');
  connect();
}
$('go').addEventListener('click', () => {
  const c = $('code').value.toUpperCase().replace(/[^A-Z]/g, '');
  if (c.length !== 4) { $('err').textContent = 'Codes are 4 letters'; return; }
  start(c);
});
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

if (room.length === 4) start(room); else show('join');
</script>
</body>
</html>
