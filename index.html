<body>
<canvas id="c"></canvas>
<div id="tune">
  <h3>TUNING</h3>

  <div id="tuneRows"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
'use strict';
// A phone that opens the main address gets the controller, not a second game screen.
// (Add ?screen to the address to force the game screen on a small device.)
if (/^https?:$/.test(location.protocol) && !/[?&]screen/.test(location.search) &&
    matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600) location.replace('/pad');
// ============================================================
//  COMET CLASH — local keyboard arena dogfights (2–4 players)
// ============================================================
const W = 1280, H = 720, CELL = 40, COLS = 32, ROWS = 18, TAU = Math.PI * 2;
const FONT = '"Orbitron", "Trebuchet MS", system-ui, sans-serif';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SCALE = 1;
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  SCALE = cv.width / W;
}
addEventListener('resize', resize); resize();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const d2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };
function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l = dx * dx + dy * dy;
  const t = l ? clamp(((px - x1) * dx + (py - y1) * dy) / l, 0, 1) : 0;
  const ex = x1 + dx * t - px, ey = y1 + dy * t - py;
  return Math.sqrt(ex * ex + ey * ey);
}

// ---------------- tuning ----------------
let SHIP_R = 15, TURN = 4.6, ACC = 560, DRAG = 2.4, GRIP = 5;
let BULLET_V = 700, RELOAD = 0.9, MAXAMMO = 3;
let DASH_ANGLE = 90, DASH_SNAP_T = 0.1, DASH_MULT = 1.6, DASH_CD = 0.5, DOUBLE_TAP = 0.26;
let PILOT_R = 7, PILOT_TURN = 5.5, PILOT_ACC = 380, PILOT_DRAG = 3.5, RESPAWN = 5;
let HITSTOP = 0.07, SLOWMO = 1.0, SHAKE = 1;
// [label, min, max, step, get, set] — shown in the ` tuning panel
const TUNABLES = [
  ['Turn speed', 2, 8, 0.1, () => TURN, v => TURN = v],
  ['Thrust', 200, 1200, 10, () => ACC, v => ACC = v],
  ['Drag', 1, 5, 0.1, () => DRAG, v => DRAG = v],
  ['Grip (less sideways slide)', 0, 12, 0.5, () => GRIP, v => GRIP = v],
  ['Bullet speed', 300, 1200, 10, () => BULLET_V, v => BULLET_V = v],
  ['Reload time (s)', 0.3, 2, 0.05, () => RELOAD, v => RELOAD = v],
  ['Dash turn angle (°)', 0, 180, 5, () => DASH_ANGLE, v => DASH_ANGLE = v],
  ['Dash turn time (s)', 0.02, 0.3, 0.01, () => DASH_SNAP_T, v => DASH_SNAP_T = v],
  ['Dash speed ×', 1, 2.5, 0.05, () => DASH_MULT, v => DASH_MULT = v],
  ['Dash cooldown (s)', 0, 2, 0.05, () => DASH_CD, v => DASH_CD = v],
  ['Double-tap window (s)', 0.1, 0.5, 0.01, () => DOUBLE_TAP, v => DOUBLE_TAP = v],
  ['Pilot thrust', 100, 800, 10, () => PILOT_ACC, v => PILOT_ACC = v],
  ['Pilot respawn (s)', 2, 10, 0.5, () => RESPAWN, v => RESPAWN = v],
  ['Hit-stop (s)', 0, 0.2, 0.01, () => HITSTOP, v => HITSTOP = v],
  ['Final-kill slow-mo (s)', 0, 2.5, 0.1, () => SLOWMO, v => SLOWMO = v],
  ['Screen shake', 0, 2, 0.1, () => SHAKE, v => SHAKE = v],
];

// ---------------- players ----------------
const PDEF = [
  { name: 'RED',   color: '#ff4f6d', turn: 'KeyQ',      fire: 'KeyW',    keys: ['Q', 'W'] },
  { name: 'BLUE',  color: '#46b3ff', turn: 'KeyB',      fire: 'KeyN',    keys: ['B', 'N'] },
  { name: 'GREEN', color: '#4dffa0', turn: 'KeyO',      fire: 'KeyP',    keys: ['O', 'P'] },
  { name: 'GOLD',  color: '#ffc93d', turn: 'ArrowLeft', fire: 'ArrowUp', keys: ['←', '↑'] },
  // slots 5–8: meant for phones and bots; no keys until you click a cap to bind some
  { name: 'PURPLE', color: '#a77bff', turn: '', fire: '', keys: ['—', '—'] },
  { name: 'ORANGE', color: '#ff8f3a', turn: '', fire: '', keys: ['—', '—'] },
  { name: 'PINK',   color: '#ff6ad5', turn: '', fire: '', keys: ['—', '—'] },
  { name: 'WHITE',  color: '#e6e9ff', turn: '', fire: '', keys: ['—', '—'] },
];
const NP = PDEF.length, PIDS = [...Array(NP).keys()];
// corners first, then the middle of each edge
const SPAWNS = [[110, 110], [W - 110, H - 110], [W - 110, 110], [110, H - 110], [W / 2, 90], [W / 2, H - 90], [90, H / 2], [W - 90, H / 2]];

const POW = {
  scatter: { color: '#ff9f43', label: 'SCATTER' },
  laser:   { color: '#ff4df0', label: 'LASER' },
  mine:    { color: '#ff5e57', label: 'MINE' },
  shield:  { color: '#4ef2ff', label: 'SHIELD' },
  jousters:{ color: '#c9ff4d', label: 'JOUSTERS' },
  bounce:  { color: '#5effc8', label: 'BOUNCING SHOTS' },
  homing:  { color: '#ffe066', label: 'HOMING SHOTS' },
};
const LANCE_HP = 3;   // each jouster lance survives this many hits
const USES = { bounce: 3, homing: 3 };          // multi-shot powers; everything else is one use
let HOMING_TURN = 1.8, HOMING_RANGE = 340;      // gentle homing so it's not OP
let MAGNET_RANGE = 110, MAGNET_PULL = 320;      // pickups drift toward nearby ships
TUNABLES.push(
  ['Homing shot turn rate', 0, 6, 0.1, () => HOMING_TURN, v => HOMING_TURN = v],
  ['Pickup magnet range', 0, 250, 5, () => MAGNET_RANGE, v => MAGNET_RANGE = v],
  ['Pickup magnet pull', 0, 800, 10, () => MAGNET_PULL, v => MAGNET_PULL = v],
);
const POW_TYPES = Object.keys(POW);

// ---------------- input ----------------
const keys = {}, pressed = {};
const RESERVED = new Set(['Space', 'Enter', 'NumpadEnter', 'Escape', 'Backquote', 'Tab', 'Digit3', 'Digit5', 'Digit7', 'Digit9']);
const KEY_DEFAULTS = PDEF.map(p => ({ turn: p.turn, fire: p.fire, keys: [...p.keys] }));
const KEYS_KEY = 'cometclash.keys.v1';
try {
  const saved = JSON.parse(localStorage.getItem(KEYS_KEY) || 'null');
  if (Array.isArray(saved)) saved.forEach((k, i) => { if (PDEF[i] && k && k.turn && k.fire && k.keys) Object.assign(PDEF[i], { turn: k.turn, fire: k.fire, keys: [...k.keys] }); });
} catch (e) { /* storage unavailable: defaults */ }
function saveKeys() { try { localStorage.setItem(KEYS_KEY, JSON.stringify(PDEF.map(p => ({ turn: p.turn, fire: p.fire, keys: p.keys })))); } catch (e) {} }
function resetKeys() { KEY_DEFAULTS.forEach((k, i) => Object.assign(PDEF[i], { turn: k.turn, fire: k.fire, keys: [...k.keys] })); saveKeys(); }
const isGameKey = c => RESERVED.has(c) || c.startsWith('Arrow') || PDEF.some(p => p.turn === c || p.fire === c);
const ARROW_LABEL = { ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓' };
function keyLabel(e) {
  if (ARROW_LABEL[e.code]) return ARROW_LABEL[e.code];
  if (e.code.startsWith('Key')) return e.code.slice(3);
  if (e.code.startsWith('Digit')) return e.code.slice(5);
  if (e.code.startsWith('Numpad')) return 'N' + e.code.slice(6, 9);
  if (e.key && e.key.length === 1) return e.key.toUpperCase();
  return e.code.replace(/Left|Right/, '').slice(0, 5).toUpperCase();
}
// lobby key rebinding: click a key cap, then press the new key
let rebind = null, lobbyMsg = '', lobbyMsgT = 0;
function lobbyNote(m) { lobbyMsg = m; lobbyMsgT = 2.5; }
function tryRebind(e) {
  const code = e.code;
  if (code === 'Escape') { rebind = null; return; }
  if (RESERVED.has(code)) { lobbyNote('That key is reserved for menus, pick another'); SFX.beep(); return; }
  const taken = PDEF.some((pd, i) => (pd.turn === code && !(i === rebind.p && rebind.which === 0)) || (pd.fire === code && !(i === rebind.p && rebind.which === 1)));
  if (taken) { lobbyNote('That key is already in use, pick another'); SFX.beep(); return; }
  const pd = PDEF[rebind.p];
  if (rebind.which === 0) pd.turn = code; else pd.fire = code;
  pd.keys[rebind.which] = keyLabel(e);
  saveKeys(); SFX.pickup(); rebind = null;
}
addEventListener('keydown', e => {
  if (isGameKey(e.code) || rebind) e.preventDefault();
  initAudio();
  if (rebind) { if (!e.repeat) tryRebind(e); return; }
  if (e.code === 'Backquote' && !e.repeat) { document.getElementById('tune').classList.toggle('open'); return; }
  if (e.repeat) return;
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
// pause automatically when the window loses focus or the tab is hidden
function autoPause() { if (state === 'play' || state === 'roundEnd') { pausedFrom = state; state = 'pause'; } }
addEventListener('blur', () => { for (const k in keys) keys[k] = false; autoPause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
// mouse: lobby options, key caps, pause buttons (rects are rebuilt every frame by render)
let clickRects = [];
cv.addEventListener('pointerdown', e => {
  initAudio();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  for (let i = clickRects.length - 1; i >= 0; i--) {
    const c = clickRects[i];
    if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) { c.fn(); return; }
  }
});
// per-player input for this step: humans read the keyboard, bots fill it from AI
const inp = PIDS.map(() => ({ turn: false, fire: false, turnP: false, fireP: false }));

// ---------------- audio (synth) ----------------
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f1, f2, dur, type = 'square', vol = 0.3) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.5, freq = 1200) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(80, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const SFX = {
  shoot: () => tone(880, 220, 0.09, 'square', 0.1),
  boom: () => { noise(0.6, 0.6, 1800); tone(160, 40, 0.4, 'sine', 0.4); },
  small: () => noise(0.15, 0.25, 2500),
  pop: () => { tone(700, 120, 0.2, 'triangle', 0.3); noise(0.2, 0.3, 3000); },
  pickup: () => tone(520, 1040, 0.12, 'triangle', 0.25),
  dash: () => noise(0.18, 0.22, 4000),
  laser: () => { tone(1400, 90, 0.35, 'sawtooth', 0.18); noise(0.3, 0.3, 5000); },
  shield: () => tone(300, 1200, 0.2, 'triangle', 0.22),
  beep: () => tone(660, 660, 0.08, 'square', 0.12),
  go: () => tone(990, 990, 0.2, 'square', 0.14),
  respawn: () => tone(330, 990, 0.25, 'triangle', 0.2),
  win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f, 0.2, 'square', 0.13), i * 120)),
};

// ---------------- maps (one quadrant, mirrored 4 ways) ----------------
// '#' solid wall, '+' breakable crate, 'o' asteroid
const MAPS = [
  { name: 'CITADEL', q: [
    '################',
    '#...............',
    '#...............',
    '#.....###.......',
    '#.....#.........',
    '#...........o...',
    '#.............++',
    '#............+##',
    '#............+##',
  ]},
  { name: 'LANES', q: [
    '################',
    '#...............',
    '#...............',
    '#...++++++......',
    '#...............',
    '#.........#.....',
    '#..o......#.....',
    '#.........#.....',
    '#.........+.....',
  ]},
  { name: 'SHARDS', q: [
    '################',
    '#...............',
    '#.......+.......',
    '#...#...+.......',
    '#.......+...o...',
    '#..+++..........',
    '#...........##..',
    '#...#.......#...',
    '#.......o.......',
  ]},
  { name: 'DRIFT', q: [
    '################',
    '#...............',
    '#...............',
    '#........o......',
    '#...##..........',
    '#...#......o....',
    '#...............',
    '#.........++....',
    '#.....o...+.....',
  ]},
  { name: 'RINGS', q: [
    '################',
    '#...............',
    '#...............',
    '#.......+++++...',
    '#......+........',
    '#.....+....##...',
    '#.....+....#....',
    '#.....+.........',
    '#..o..+.........',
  ]},
  { name: 'MAZE', q: [
    '################',
    '#...............',
    '#...............',
    '#...####...##...',
    '#......#........',
    '#..o...#...+....',
    '#......+...+..o.',
    '#...##.....+....',
    '#...#...........',
  ]},
];
// random symmetric arena: a few wall/crate segments + asteroids in one quadrant, mirrored
function generateMap() {
  const g = Array.from({ length: 9 }, (_, r) => [...(r === 0 ? '################' : '#' + '.'.repeat(15))]);
  const segs = 4 + Math.floor(Math.random() * 4);
  for (let k = 0; k < segs; k++) {
    const horiz = Math.random() < 0.5, len = 2 + Math.floor(Math.random() * 4);
    const r0 = 2 + Math.floor(Math.random() * 7), c0 = 3 + Math.floor(Math.random() * 12);
    const ch = Math.random() < 0.55 ? '#' : '+';
    for (let i = 0; i < len; i++) {
      const r = horiz ? r0 : r0 + i, c = horiz ? c0 + i : c0;
      if (r < 9 && c < 16 && !(r <= 4 && c <= 5)) g[r][c] = ch;
    }
  }
  for (let k = 0, n = 1 + Math.floor(Math.random() * 2); k < n; k++) {
    const r = 2 + Math.floor(Math.random() * 7), c = 6 + Math.floor(Math.random() * 9);
    if (g[r][c] === '.') g[r][c] = 'o';
  }
  return { name: 'GENERATED', q: g.map(r => r.join('')) };
}

// ---------------- state ----------------
let state = 'lobby', time = 0;
let joined = PIDS.map(() => false), scores = PIDS.map(() => 0), target = 5;
let ships = [], pilots = [], bullets = [], rocks = [], powerups = [], mines = [], beams = [], parts = [], floaters = [];
let gridB = [];
const ROUND_END_TIME = 2.5;
let countdown = 0, endTimer = -1, roundEndT = 0, roundWinner = -1, powerTimer = 0, shake = 0;
let mapIdx = -1, roundNum = 0, matchWinner = -1, lastScored = -1;
let hitstop = 0, slowT = 0, flashT = 0, focus = null, lastKill = null;
const cam = { x: W / 2, y: H / 2, z: 1 };
let pausedFrom = 'play', matchEndT = 0, mapName = '';
const TEAMS = [{ name: 'TEAM A', color: '#ff8a3d' }, { name: 'TEAM B', color: '#3dd6ff' }];
// react: seconds a target must stay in the sights before firing · aimErr: random aim offset (radians)
// wander: chance per few seconds to lose interest and drift · path: steers around walls · pows: chases power-ups
const BOT = [
// lag: seconds for their idea of where you are to catch up (no instant snapping) · hold: min turn press (overshoot)
  { name: 'EASY',   react: 0.55, aimTol: 0.35, aimErr: 0.5,  fireCd: 1.6,  lead: 0,   wander: 0.45, path: false, pows: false, look: 0.6,  lag: 0.5,  hold: 0.12 },
  { name: 'NORMAL', react: 0.32, aimTol: 0.26, aimErr: 0.3,  fireCd: 1.0,  lead: 0.3, wander: 0.2,  path: true,  pows: true,  look: 0.85, lag: 0.3,  hold: 0.08 },
  { name: 'HARD',   react: 0.04, aimTol: 0.12, aimErr: 0,    fireCd: 0.25, lead: 1,   wander: 0,    path: true,  pows: true,  look: 1,    lag: 0.04, hold: 0 },
];
const brain = PIDS.map(() => ({ t: 0, fcd: 0 }));
// match settings (lobby), saved in this browser
const CFG_KEY = 'cometclash.cfg.v1';
const cfg = { target: 5, triple: true, teams: false, map: 0, asteroids: true, botLevel: 1,
  pows: Object.fromEntries(POW_TYPES.map(t => [t, true])), slots: PIDS.map(() => 'off'), team: PIDS.map(i => i % 2) };
try {
  const sv = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
  if (sv) for (const k of Object.keys(cfg)) if (sv[k] !== undefined) cfg[k] = (cfg[k] && typeof cfg[k] === 'object' && !Array.isArray(cfg[k])) ? { ...cfg[k], ...sv[k] } : sv[k];
} catch (e) { /* defaults */ }
if (cfg.map > MAPS.length + 1) cfg.map = 0;
cfg.slots = PIDS.map(i => cfg.slots[i] === 'phone' || !cfg.slots[i] ? 'off' : cfg.slots[i]); // phones re-join after a reload
cfg.team = PIDS.map(i => cfg.team[i] === 0 || cfg.team[i] === 1 ? cfg.team[i] : i % 2);
function syncCfg() { target = cfg.target; joined = cfg.slots.map(m => m !== 'off'); try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} }
syncCfg();
const usesFor = t => cfg.triple ? 3 : (USES[t] || 1);
const randPow = () => { const en = POW_TYPES.filter(t => cfg.pows[t]); return en.length ? pick(en) : null; };
// kill tracking
let stats = [], feed = [];
function resetStats() { stats = PIDS.map(() => ({ kills: 0, lost: 0, outs: 0, wpn: {} })); feed = []; }
resetStats();
function recordKill(by, victim, wpn, pilot) {
  if (pilot) stats[victim].outs++; else stats[victim].lost++;
  if (by != null && by >= 0 && foes(by, victim)) { stats[by].kills++; stats[by].wpn[wpn] = (stats[by].wpn[wpn] || 0) + 1; }
  feed.unshift({ by: by == null ? -1 : by, victim, wpn, pilot, self: by === victim, t: 4 });
  if (feed.length > 5) feed.pop();
}
const stars = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.3, b: Math.random() }));

function makeRock(x, y, r) {
  const pts = []; for (let i = 0; i < 10; i++) pts.push(r * rand(0.72, 1.08));
  const a = rand(0, TAU), sp = r > 16 ? rand(10, 28) : rand(40, 80);
  const hp = r > 16 ? 3 : 1;
  // pre-made crack lines (in rock space) revealed one per hit taken
  const cracks = [0, 1, 2].map(k => {
    const a = rand(0, TAU / 3) + k * TAU / 3, b = a + rand(-0.5, 0.5);
    return [[Math.cos(a) * r * 0.1, Math.sin(a) * r * 0.1], [Math.cos(b) * r * 0.5, Math.sin(b) * r * 0.5], [Math.cos(a + rand(-0.3, 0.3)) * r * 0.95, Math.sin(a + rand(-0.3, 0.3)) * r * 0.95]];
  });
  return { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r, hp, maxHp: hp, cracks, pts, rot: rand(0, TAU), vr: rand(-0.7, 0.7), flash: 0 };
}

function buildMap(def) {
  gridB = []; rocks = [];
  for (let r = 0; r < ROWS; r++) {
    const qr = r < 9 ? r : 17 - r;

function playUpdate(dt) {

  gatherInputs(dt);
  for (const f of feed) f.t -= dt;

    const before = Math.ceil(countdown / 0.6);

      }

  bullets = bullets.filter(b => !b.dead);
  rocks = rocks.filter(r => !r.dead);
  mines = mines.filter(m => !m.done);
  powerups = powerups.filter(p => !p.taken && p.t < 15);
  beams = beams.filter(b => b.t > 0);
  if (bullets.length > 300) bullets.splice(0, bullets.length - 300);
  for (const row of gridB) for (const b of row) if (b) b.flash -= dt;

  // --- round end ---
  if (!frozen) {
    const alive = aliveSides(), multi = activeSides().length > 1;
    const over = multi ? alive.length <= 1 : alive.length === 0;
    if (over && endTimer < 0) {
      endTimer = 1.6;
      if (multi && SLOWMO > 0 && lastKill) { slowT = SLOWMO; focus = { ...lastKill }; }
    }
    if (endTimer >= 0) { endTimer -= dt; if (endTimer <= 0) finishRound(); }
  }
}

// ---------------- rendering ----------------
// pre-rendered once: deep-space gradient with a few soft nebula clouds, and an edge vignette
const BG = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const base = g.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W * 0.75);
  base.addColorStop(0, '#14132e'); base.addColorStop(1, '#05050c');
  g.fillStyle = base; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter';
  for (const [x, y, r, col] of [[W * 0.18, H * 0.25, 420, '74,40,140'], [W * 0.82, H * 0.7, 460, '20,70,130'], [W * 0.55, H * 0.1, 300, '120,30,90'], [W * 0.3, H * 0.9, 320, '30,90,110']]) {
    const n = g.createRadialGradient(x, y, 0, x, y, r);
    n.addColorStop(0, `rgba(${col},0.22)`); n.addColorStop(0.5, `rgba(${col},0.08)`); n.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = n; g.fillRect(0, 0, W, H);
  }
  return c;
})();
const VIGNETTE = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,8,0.55)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  return c;
})();
function drawBackground() {
  ctx.drawImage(BG, 0, 0, W, H);
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.5 * Math.abs(Math.sin(time * 0.8 + s.b * 10));
    ctx.fillStyle = '#c9d4ff'; ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(120,130,255,0.05)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += CELL) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += CELL) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}

function drawBlocks() {
  for (const row of gridB) for (const b of row) {
    if (!b) continue;
    if (b.solid) {
      ctx.fillStyle = b.flash > 0 ? '#3a3f7a' : '#1a1c38';
      ctx.fillRect(b.x, b.y, CELL, CELL);
      // draw edges only where neighbouring cell is open → reads as one continuous wall
      ctx.beginPath();
      const open = (c, r) => { const n = cellAt(c, r); return r >= 0 && r < ROWS && c >= 0 && c < COLS && (!n || !n.solid); };
      if (open(b.c, b.r - 1)) { ctx.moveTo(b.x, b.y + 1); ctx.lineTo(b.x + CELL, b.y + 1); }
      if (open(b.c, b.r + 1)) { ctx.moveTo(b.x, b.y + CELL - 1); ctx.lineTo(b.x + CELL, b.y + CELL - 1); }
      if (open(b.c - 1, b.r)) { ctx.moveTo(b.x + 1, b.y); ctx.lineTo(b.x + 1, b.y + CELL); }
      if (open(b.c + 1, b.r)) { ctx.moveTo(b.x + CELL - 1, b.y); ctx.lineTo(b.x + CELL - 1, b.y + CELL); }
      ctx.strokeStyle = 'rgba(110,120,255,0.16)'; ctx.lineWidth = 8; ctx.stroke(); // soft neon glow
      ctx.strokeStyle = '#6a73e6'; ctx.lineWidth = 2; ctx.stroke();
    } else {
      const x = b.x + 3, y = b.y + 3, s = CELL - 6;
      ctx.fillStyle = b.flash > 0 ? '#ffd2a1' : '#3b2614';
      ctx.fillRect(x, y, s, s);
      ctx.strokeStyle = '#d9944d'; ctx.lineWidth = 2; ctx.strokeRect(x, y, s, s);
      ctx.strokeStyle = 'rgba(217,148,77,0.45)'; ctx.beginPath();
      ctx.moveTo(x + 6, y + 6); ctx.lineTo(x + s - 6, y + s - 6); ctx.moveTo(x + s - 6, y + 6); ctx.lineTo(x + 6, y + s - 6); ctx.stroke();
      if (b.hp < 3) {
        ctx.strokeStyle = '#ffcf99'; ctx.lineWidth = 1.5; ctx.beginPath();
        ctx.moveTo(x + 4, y + s * 0.3); ctx.lineTo(x + s * 0.45, y + s * 0.5); ctx.lineTo(x + s * 0.4, y + s - 4);
        if (b.hp < 2) { ctx.moveTo(x + s - 4, y + 6); ctx.lineTo(x + s * 0.55, y + s * 0.45); ctx.lineTo(x + s * 0.8, y + s - 6); }
        ctx.stroke();
      }
    }
  }
}

function shipPath() {
  ctx.beginPath();
  ctx.moveTo(19, 0); ctx.lineTo(3, -7); ctx.lineTo(-6, -14); ctx.lineTo(-13, -14); ctx.lineTo(-9, -5);
  ctx.lineTo(-12, 0); ctx.lineTo(-9, 5); ctx.lineTo(-13, 14); ctx.lineTo(-6, 14); ctx.lineTo(3, 7);
  ctx.closePath();
}
function drawShipBody(color, flame, flash) {
  if (flame) {
    const l = rand(7, 14);
    ctx.fillStyle = '#ffb347';
    ctx.beginPath(); ctx.moveTo(-11, -3.5); ctx.lineTo(-11 - l, 0); ctx.lineTo(-11, 3.5); ctx.fill();
    ctx.fillStyle = '#fff6d0';
    ctx.beginPath(); ctx.moveTo(-11, -2); ctx.lineTo(-11 - l * 0.5, 0); ctx.lineTo(-11, 2); ctx.fill();
  }
  shipPath();
  ctx.fillStyle = flash ? '#ffffff' : color; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.moveTo(-6, -14); ctx.lineTo(-13, -14); ctx.lineTo(-9, -5); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6, 14); ctx.lineTo(-13, 14); ctx.lineTo(-9, 5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#0b0d1f'; ctx.beginPath(); ctx.ellipse(3, 0, 6, 3.4, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.ellipse(5, -1, 2, 1, 0, 0, TAU); ctx.fill();
}

function drawIcon(type, x, y, sz, color) {
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = Math.max(1.5, sz * 0.22); ctx.lineCap = 'round';
  if (type === 'scatter') {
    for (let i = -1; i <= 1; i++) {
      const a = i * 0.55, ex = Math.cos(a) * sz, ey = Math.sin(a) * sz;
      ctx.beginPath(); ctx.moveTo(-sz * 0.8, 0); ctx.lineTo(ex * 0.75, ey * 0.75); ctx.stroke();
      ctx.beginPath(); ctx.arc(ex, ey, sz * 0.22, 0, TAU); ctx.fill();
    }
  } else if (type === 'laser') {
    ctx.beginPath();
    ctx.moveTo(sz * 0.25, -sz); ctx.lineTo(-sz * 0.35, sz * 0.1); ctx.lineTo(sz * 0.25, sz * 0.1); ctx.lineTo(-sz * 0.25, sz);
    ctx.stroke();
  } else if (type === 'mine') {
    for (let i = 0; i < 4; i++) {
      const a = i * TAU / 4 + Math.PI / 4;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * sz, Math.sin(a) * sz); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.5, 0, TAU); ctx.fill();
  } else if (type === 'shield') {
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.85, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.35, 0, TAU); ctx.fill();
  } else if (type === 'jousters') {
    for (const yy of [-sz * 0.5, sz * 0.5]) {
      ctx.beginPath(); ctx.moveTo(-sz, yy); ctx.lineTo(sz * 0.5, yy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sz * 0.4, yy - sz * 0.3); ctx.lineTo(sz * 1.1, yy); ctx.lineTo(sz * 0.4, yy + sz * 0.3); ctx.fill();
    }
  } else if (type === 'bounce') {
    ctx.beginPath(); ctx.moveTo(-sz, -sz * 0.6); ctx.lineTo(-sz * 0.2, sz * 0.6); ctx.lineTo(sz * 0.5, -sz * 0.4); ctx.stroke();
    ctx.beginPath(); ctx.arc(sz * 0.75, -sz * 0.75, sz * 0.28, 0, TAU); ctx.fill();
  } else if (type === 'homing') {
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.75, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-sz, 0); ctx.lineTo(-sz * 0.4, 0); ctx.moveTo(sz, 0); ctx.lineTo(sz * 0.4, 0);
    ctx.moveTo(0, -sz); ctx.lineTo(0, -sz * 0.4); ctx.moveTo(0, sz); ctx.lineTo(0, sz * 0.4); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.18, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function teamRing(x, y, r, p) {
  ctx.strokeStyle = TEAMS[cfg.team[p]].color; ctx.globalAlpha = 0.6; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
}
function drawWorld() {
  drawBlocks();

  // mines
  for (const m of mines) {
    const armed = m.arm <= 0, blink = armed ? (Math.sin(m.t * 18) > 0) : (Math.sin(m.t * 40) > 0);
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.t * 1.5);
    ctx.strokeStyle = PDEF[m.owner].color; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 6, Math.sin(a) * 6); ctx.lineTo(Math.cos(a) * 12, Math.sin(a) * 12); ctx.stroke(); }
    ctx.fillStyle = '#2a1012'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = blink ? '#ff5e57' : '#5a1a1a'; ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, TAU); ctx.fill();
    ctx.restore();
    if (armed) { // faint trigger ring + dashed kill zone
      ctx.strokeStyle = 'rgba(255,94,87,0.12)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(m.x, m.y, 44, 0, TAU); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,94,87,0.22)'; ctx.setLineDash([3, 6]); ctx.beginPath(); ctx.arc(m.x, m.y, MINE_R * MINE_LETHAL, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // rocks
  for (const rk of rocks) {
    ctx.save(); ctx.translate(rk.x, rk.y); ctx.rotate(rk.rot);
    ctx.beginPath();
    rk.pts.forEach((r, i) => { const a = i / rk.pts.length * TAU; i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); });
    ctx.closePath();
    const pc = rk.pow ? POW[rk.pow].color : null;
    if (pc) { ctx.shadowColor = pc; ctx.shadowBlur = 14 + 6 * Math.sin(time * 5); }
    ctx.fillStyle = rk.flash > 0 ? '#ffffff' : pc ? pc + '50' : '#272240'; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = pc || '#8d83d6'; ctx.lineWidth = pc ? 3 : 2; ctx.stroke();
    if (!pc) { ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(rk.r * 0.25, -rk.r * 0.2, rk.r * 0.22, 0, TAU); ctx.fill(); }
    const dmg = Math.min(rk.cracks.length, (rk.maxHp || 1) - rk.hp);
    for (let k = 0; k < dmg; k++) { // one crack per hit taken
      const c = rk.cracks[k];
      ctx.beginPath(); ctx.moveTo(c[0][0], c[0][1]); ctx.lineTo(c[1][0], c[1][1]); ctx.lineTo(c[2][0], c[2][1]);
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(5,5,12,0.9)'; ctx.lineWidth = 3.5; ctx.stroke(); // dark groove
      ctx.strokeStyle = pc || '#e2ddff'; ctx.globalAlpha = 0.85; ctx.lineWidth = 1.4; ctx.stroke(); ctx.globalAlpha = 1; // light edge
    }
    ctx.restore();
    if (pc) drawIcon(rk.pow, rk.x, rk.y, 7, '#ffffff');
  }

  // powerups
  for (const pu of powerups) {
    const c = POW[pu.type].color, bob = Math.sin(pu.t * 4) * 2;
    if (pu.t > 12 && Math.sin(pu.t * 20) < 0) continue;
    ctx.save(); ctx.translate(pu.x, pu.y + bob);
    ctx.globalAlpha = 0.25 + 0.15 * Math.sin(pu.t * 6); ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    ctx.rotate(Math.PI / 4 + Math.sin(pu.t * 2) * 0.2);
    ctx.fillStyle = '#0d0d1c'; ctx.strokeStyle = c; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-11, -11, 22, 22, 4); ctx.fill(); ctx.stroke();
    ctx.restore();
    drawIcon(pu.type, pu.x, pu.y + bob, 7, c);
  }

  // beams
  ctx.globalCompositeOperation = 'lighter';
  for (const bm of beams) {
    const k = bm.t / bm.max;
    ctx.lineCap = 'round';
    ctx.strokeStyle = bm.color; ctx.globalAlpha = k * 0.6; ctx.lineWidth = 18 * k + 4;
    ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = k; ctx.lineWidth = 5 * k + 1;
    ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // particles
  for (const p of parts) {
    const k = p.life / p.max;
    if (p.ghost) {
      ctx.globalAlpha = k * 0.45; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      drawShipBody(p.color, false, false); ctx.restore(); continue;
    }
    if (p.ring) {
      ctx.globalAlpha = k; ctx.strokeStyle = p.color; ctx.lineWidth = 3 * k + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - k * 0.8), 0, TAU); ctx.stroke();
    } else {
      ctx.globalAlpha = Math.min(1, k * 1.4); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + k * 0.6), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // bullets
  for (const b of bullets) {
    const c = b.kind ? POW[b.kind].color : PDEF[b.owner].color;
    ctx.strokeStyle = c; ctx.globalAlpha = 0.5; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x - b.vx * 0.03, b.y - b.vy * 0.03); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.fillStyle = c; ctx.globalAlpha = 0.45;
    ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // pilots
  for (const q of pilots) {
    const pd = PDEF[q.p];
    if (cfg.teams) teamRing(q.x, q.y, 20, q.p);
    const prog = 1 - q.timer / RESPAWN;
    ctx.strokeStyle = pd.color; ctx.globalAlpha = 0.25; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(q.x, q.y, 15, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(q.x, q.y, 15, -Math.PI / 2, -Math.PI / 2 + prog * TAU); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.a);
    if (q.thrust) { ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.moveTo(-7, -2.5); ctx.lineTo(-7 - rand(4, 8), 0); ctx.lineTo(-7, 2.5); ctx.fill(); }
    ctx.fillStyle = '#e9ecff'; ctx.fillRect(-8, -4, 4, 8);
    ctx.fillStyle = pd.color; ctx.beginPath(); ctx.arc(0, 0, PILOT_R, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#0b0d1f'; ctx.beginPath(); ctx.ellipse(2.5, 0, 3, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(3.5, -1.5, 1, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // ships
  const frozen = countdown > 0;
  for (const s of ships) {
    const pd = PDEF[s.p];
    if (s.inv > 0 && Math.sin(time * 40) < 0) continue;
    if (cfg.teams) teamRing(s.x, s.y, 25, s.p);
    { // soft colored halo so ships pop against the background
      const hg = ctx.createRadialGradient(s.x, s.y, 4, s.x, s.y, 36);
      hg.addColorStop(0, pd.color + '40'); hg.addColorStop(1, pd.color + '00');
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(s.x, s.y, 36, 0, TAU); ctx.fill();
    }
    // ammo pips behind the ship
    for (let i = 0; i < MAXAMMO; i++) {
      const a = s.a + Math.PI + (i - 1) * 0.5, px = s.x + Math.cos(a) * 26, py = s.y + Math.sin(a) * 26;
      ctx.beginPath(); ctx.arc(px, py, 3 * (i === s.ammo - 1 ? 1 + s.pop : 1), 0, TAU);
      if (i < s.ammo) { ctx.fillStyle = pd.color; ctx.fill(); }
      else { ctx.strokeStyle = pd.color; ctx.globalAlpha = 0.45; ctx.lineWidth = 1.2; ctx.stroke(); ctx.globalAlpha = 1; }
    }
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
    if (s.lances) {
      [-15, 15].forEach((ly, i) => {
        const hp = s.lances[i]; if (hp <= 0) return;
        const k = hp / LANCE_HP;
        ctx.lineCap = 'round';
        ctx.strokeStyle = POW.jousters.color; ctx.globalAlpha = 0.15 + 0.25 * k; ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(-4, ly); ctx.lineTo(32, ly); ctx.stroke();
        ctx.globalAlpha = 0.5 + 0.5 * k; ctx.strokeStyle = '#f4ffe0'; ctx.lineWidth = 1.5 + k;
        ctx.beginPath(); ctx.moveTo(-4, ly); ctx.lineTo(30, ly); ctx.stroke();
        ctx.fillStyle = POW.jousters.color;
        ctx.beginPath(); ctx.moveTo(27, ly - 4); ctx.lineTo(37, ly); ctx.lineTo(27, ly + 4); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1; ctx.fillStyle = '#555c70'; ctx.fillRect(-6, ly - 2.5, 6, 5);
        for (let n = 0; n < hp; n++) { ctx.fillStyle = POW.jousters.color; ctx.fillRect(2 + n * 6, ly - 1, 3, 2); } // durability notches
      });
    }
    if (s.kick > 0) { ctx.translate(-4 * s.kick, 0); ctx.scale(1 - 0.15 * s.kick, 1 + 0.1 * s.kick); }
    drawShipBody(pd.color, !frozen, s.flash > 0);
    ctx.restore();
    if (s.shield) {
      ctx.strokeStyle = POW.shield.color; ctx.lineWidth = 2; ctx.globalAlpha = 0.6 + 0.3 * Math.sin(time * 8);
      ctx.beginPath(); ctx.arc(s.x, s.y, 23, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (s.power) {
      drawIcon(s.power, s.x, s.y - 32, 6, POW[s.power].color);
      if (s.uses > 1) { ctx.font = `800 10px ${FONT}`; ctx.fillStyle = POW[s.power].color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('×' + s.uses, s.x + 9, s.y - 32); }
    }
  }

  // floaters
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters) {
    ctx.globalAlpha = Math.min(1, f.life / f.max * 2);
    ctx.font = `800 ${f.size}px ${FONT}`; ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const sides = activeSides(), alive = aliveSides();
  const many = sides.length > 4, pipW = many ? 8 : 12, gap = many ? 14 : 26, groupW = target * pipW + 30;
  let x = W / 2 - (sides.length * groupW + (sides.length - 1) * gap) / 2;
  for (const sd of sides) {
    const col = sideColor(sd);
    ctx.globalAlpha = state === 'play' && !alive.includes(sd) ? 0.35 : 1;
    if (cfg.teams) { ctx.font = `800 14px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(sd ? 'B' : 'A', x + 8, 20); }
    else { ctx.save(); ctx.translate(x + 8, 20); ctx.scale(0.5, 0.5); drawShipBody(col, false, false); ctx.restore(); }
    for (let i = 0; i < target; i++) {
      ctx.beginPath(); ctx.arc(x + 30 + i * pipW, 20, many ? 3 : 4, 0, TAU);
      if (i < scores[sd]) { ctx.fillStyle = col; ctx.fill(); } else { ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    x += groupW + gap;
  }
  ctx.font = `600 12px ${FONT}`; ctx.fillStyle = 'rgba(180,190,255,0.6)'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(`ROUND ${roundNum} · ${mapName}`, 16, 20);
  ctx.textAlign = 'right'; ctx.fillText('ESC: PAUSE', W - 16, 20);
  if (countdown > 0) {
    const n = Math.ceil(countdown / 0.6), k = (countdown % 0.6) / 0.6;
    ctx.textAlign = 'center'; ctx.font = `800 ${90 + k * 40}px ${FONT}`;
    ctx.fillStyle = `rgba(255,255,255,${0.4 + k * 0.6})`; ctx.fillText(String(n), W / 2, H / 2 + 20);
  }
  drawFeed();
}

// kill feed (top right): KILLER  [weapon]  VICTIM
const WPN_TEXT = { gun: '→', ram: 'RAM' };

  ctx.save();

  drawHUD();

  if (view === 'roundEnd') {

    drawScoreboard(roundWinner >= 0 ? `${sideName(roundWinner)} TAKES THE ROUND` : 'DRAW · NO POINT', col, `NEXT ROUND IN ${Math.max(1, Math.ceil(roundEndT))}…`);
    const k = clamp(roundEndT / ROUND_END_TIME, 0, 1), bw = 560, by = H / 2 + scoreboardHeight() / 2 - 10;
    ctx.fillStyle = 'rgba(120,130,255,0.2)'; ctx.fillRect(W / 2 - bw / 2, by, bw, 4);

function drawWorldParticlesOnly() {
  for (const p of parts) {
    if (p.ring) continue;
    ctx.globalAlpha = Math.min(1, p.life / p.max * 1.4); ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size * 1.5, p.size * 1.5);

const TUNE_KEY = 'cometclash.tune.v2';
const tuneDefaults = TUNABLES.map(t => t[4]());
try {
  const saved = JSON.parse(localStorage.getItem(TUNE_KEY) || 'null');
  if (saved) TUNABLES.forEach(t => { if (typeof saved[t[0]] === 'number') t[5](saved[t[0]]); });
} catch (e) { /* storage unavailable — defaults are fine */ }
function saveTune() {
  try { const o = {}; TUNABLES.forEach(t => o[t[0]] = t[4]()); localStorage.setItem(TUNE_KEY, JSON.stringify(o)); } catch (e) {}
}
function buildTunePanel() {
  const rows = document.getElementById('tuneRows'); rows.innerHTML = '';
  for (const [label, min, max, st, get, set] of TUNABLES) {
    const fmt = v => (+v).toFixed(st < 0.1 ? 2 : st < 1 ? 1 : 0);
    const lab = document.createElement('label'), name = document.createElement('span'), val = document.createElement('b');
    name.textContent = label; val.textContent = fmt(get()); lab.append(name, val);
    const inp = document.createElement('input');
    Object.assign(inp, { type: 'range', min, max, step: st, value: get() });
    inp.addEventListener('input', () => { set(+inp.value); val.textContent = fmt(inp.value); saveTune(); });
    inp.addEventListener('change', () => inp.blur()); // hand the keyboard back to the game
    rows.append(lab, inp);
  }
}
buildTunePanel();
document.getElementById('tuneReset').addEventListener('click', e => {
  TUNABLES.forEach((t, i) => t[5](tuneDefaults[i])); saveTune(); buildTunePanel(); e.currentTarget.blur();
});

// ---------------- phone controllers (needs server.py; the game works fine without it) ----------------
// The TV page is the "host". Phones open /pad, get a slot, and send TURN/FIRE up/down events,
// which land in phoneIn[] and are read by gatherInputs() exactly like keyboard or bot input.
const net = { ws: null, ok: false, code: '', lan: '', qr: null, bigQR: false, pads: {}, tokens: {}, pushT: 0 };
const phoneIn = PIDS.map(() => ({ turn: false, fire: false, turnP: 0, fireP: 0, id: null, connected: false }));
const padStatus = PIDS.map(() => null);
// opened on localhost: use the address the server advertises (LAN or Funnel); otherwise phones use the same address as this page
const padURL = () => `${/^(localhost|127\.|\[::1\])/.test(location.hostname) ? (net.lan || location.origin) : location.origin}/pad?room=${net.code}`;
function netSend(o) { if (net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(o)); }
function netConnect() {
  if (!/^https?:$/.test(location.protocol)) return; // opened as a file: keyboard-only
  let ws;
  try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`); } catch (e) { return; }
  net.ws = ws;
  ws.onopen = () => { let want = ''; try { want = sessionStorage.getItem('cc.room') || ''; } catch (e) {} ws.send(JSON.stringify({ t: 'host', want })); };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (_) { return; } netMsg(m); };
  ws.onclose = () => { net.ok = false; net.ws = null; setTimeout(netConnect, 3000); };
}
function netMsg(m) {
  if (m.t === 'room') {
    net.ok = true; net.code = m.code; net.lan = m.lan;
    try { sessionStorage.setItem('cc.room', m.code); } catch (e) {}
    try { const q = qrcode(0, 'M'); q.addData(padURL()); q.make(); net.qr = q; } catch (e) { net.qr = null; } // QR library offline: show the address only
  } else if (m.t === 'join') padJoin(m);
  else if (m.t === 'leave') padLeave(m.id);
  else if (m.t === 'in') {
    const pad = net.pads[m.id]; if (!pad || pad.slot < 0) return;
    const o = phoneIn[pad.slot]; if (o.id !== m.id) return;
    // queue presses (max 3) so quick taps that land between frames all count
    if (m.turn && !o.turn) o.turnP = Math.min(3, o.turnP + 1);
    if (m.fire && !o.fire) o.fireP = Math.min(3, o.fireP + 1);
    o.turn = !!m.turn; o.fire = !!m.fire;
  }
}
function padJoin(m) {
  let slot = -1;
  const prev = net.tokens[m.token];
  if (m.token && prev != null && cfg.slots[prev] === 'phone' && !phoneIn[prev].connected) slot = prev; // same phone reconnecting
  if (slot < 0 && state === 'lobby') slot = [4, 5, 6, 7, 0, 1, 2, 3].find(i => cfg.slots[i] === 'off') ?? -1;
  if (slot < 0) {
    net.pads[m.id] = { slot: -1, token: m.token, name: m.name };
    netSend({ t: 'to', id: m.id, m: { t: 'full', msg: state === 'lobby' ? 'Game is full. You’ll get the next free slot' : 'Match in progress. You’ll join in the lobby' } });
    return;
  }
  cfg.slots[slot] = 'phone'; syncCfg();
  net.pads[m.id] = { slot, token: m.token, name: m.name };
  if (m.token) net.tokens[m.token] = slot;
  Object.assign(phoneIn[slot], { turn: false, fire: false, turnP: 0, fireP: 0, id: m.id, connected: true });
  padStatus[slot] = null;
  SFX.pickup(); lobbyNote(`${PDEF[slot].name} joined on a phone`);
}
function padLeave(id) {
  const pad = net.pads[id]; delete net.pads[id];
  if (!pad || pad.slot < 0) return;
  const ph = phoneIn[pad.slot]; if (ph.id !== id) return;
  Object.assign(ph, { connected: false, turn: false, fire: false, turnP: 0, fireP: 0 });
  ph.leftAt = time; // slot held for a reconnect: 15s in the lobby, the whole match in game
  lobbyNote(`${PDEF[pad.slot].name}'s phone disconnected`);
}
function kickPad(slot) {
  const id = phoneIn[slot].id;
  netSend({ t: 'to', id, m: { t: 'kicked' } });
  if (net.pads[id]) net.pads[id].slot = -2; // not auto-seated again
  Object.assign(phoneIn[slot], { connected: false, turn: false, fire: false });
  cfg.slots[slot] = 'off'; syncCfg();
}
function netLobbyTick() {
  for (let p = 0; p < NP; p++) if (cfg.slots[p] === 'phone' && !phoneIn[p].connected && time - (phoneIn[p].leftAt || 0) > 15) { cfg.slots[p] = 'off'; syncCfg(); }
  for (const id in net.pads) {
    const pad = net.pads[id];
    if (pad.slot === -1 && cfg.slots.includes('off')) padJoin({ id: +id, token: pad.token, name: pad.name });
  }
}
// what each phone shows: color, name, score, and what's happening to you right now
function padStateFor(p) {
  const base = { name: PDEF[p].name, color: PDEF[p].color, team: cfg.teams ? TEAMS[cfg.team[p]].name : '', score: scores[sideOf(p)] || 0, target };
  const view = state === 'pause' ? pausedFrom : state;
  if (state === 'lobby') return { ...base, score: 0, target: 0, mode: 'lobby', text: 'You’re in! Waiting for the game to start' };
  if (state === 'pause') return { ...base, mode: 'pause', text: 'Paused' };
  if (view === 'matchEnd') return { ...base, mode: sideOf(p) === matchWinner ? 'win' : 'over', text: sideOf(p) === matchWinner ? 'You win the match!' : `${sideName(matchWinner)} wins the match` };
  if (view === 'roundEnd') return { ...base, mode: 'roundEnd', text: roundWinner < 0 ? 'Draw' : sideOf(p) === roundWinner ? 'You took the round!' : `${sideName(roundWinner)} takes the round` };
  const s = ships.find(x => x.p === p && !x.dead), q = pilots.find(x => x.p === p && !x.dead);
  if (countdown > 0) return { ...base, mode: 'ship', text: 'Get ready…' };
  if (s) return { ...base, mode: 'ship', text: s.power ? POW[s.power].label + (s.uses > 1 ? ' ×' + s.uses : '') : s.lances ? 'JOUSTERS' : s.shield ? 'SHIELD' : 'Flying' };
  if (q) return { ...base, mode: 'pilot', text: `Pilot! New ship in ${Math.ceil(q.timer)}s` };
  return { ...base, mode: 'out', text: 'Out this round' };
}
function netTick(dt) {
  net.pingT = (net.pingT || 0) - dt;
  if (net.pingT <= 0) { net.pingT = 10; netSend({ t: 'ping' }); } // keeps quiet connections from being cut
  net.pushT -= dt;
  if (!net.ok || net.pushT > 0) return;
  net.pushT = 0.1;
  for (let p = 0; p < NP; p++) {
    if (cfg.slots[p] !== 'phone' || !phoneIn[p].connected) continue;
    const st = padStateFor(p), key = JSON.stringify(st);
    if (key === padStatus[p]) continue;
    const prev = padStatus[p] ? JSON.parse(padStatus[p]) : null;
    padStatus[p] = key;
    const buzz = !prev ? '' : prev.mode === 'ship' && st.mode === 'pilot' ? 'hit' : prev.mode !== 'out' && st.mode === 'out' ? 'out' : prev.mode !== 'win' && st.mode === 'win' ? 'win' : '';
    netSend({ t: 'to', id: phoneIn[p].id, m: { t: 'status', ...st, buzz } });
  }
}
function drawQR(q, x, y, size) {
  const n = q.getModuleCount(), quiet = 2, cell = size / (n + quiet * 2);
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(x, y, size, size, 6); ctx.fill();
  ctx.fillStyle = '#06060d';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (q.isDark(r, c)) ctx.fillRect(x + (c + quiet) * cell, y + (r + quiet) * cell, cell + 0.4, cell + 0.4);
}
function drawPhoneJoin() {
  const x = 16, y = 10;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  if (!net.ok) {
    ctx.font = `700 11px ${FONT}`; ctx.fillStyle = 'rgba(200,205,255,0.55)';
    ctx.fillText('PHONE CONTROLLERS', x, y + 10);
    ctx.font = `600 10px ${FONT}`;
    ctx.fillText('run  python3 server.py  and open', x, y + 28);
    ctx.fillText('the address it prints', x, y + 44);
    return;
  }
  const size = 92;
  if (net.qr) { drawQR(net.qr, x, y, size); clickRects.push({ x, y, w: size, h: size, fn: () => { net.bigQR = true; } }); }
  const tx = x + (net.qr ? size + 12 : 0);
  ctx.font = `800 12px ${FONT}`; ctx.fillStyle = '#ffffff'; ctx.fillText('JOIN ON YOUR PHONE', tx, y + 10);
  ctx.font = `600 10px ${FONT}`; ctx.fillStyle = 'rgba(200,205,255,0.7)'; ctx.fillText('scan the code, or open', tx, y + 28);
  ctx.fillStyle = '#ffffff'; ctx.fillText(padURL().replace(/^https?:\/\//, '').replace(/\?.*$/, ''), tx, y + 43);
  ctx.fillStyle = 'rgba(200,205,255,0.7)'; ctx.fillText('and enter room', tx, y + 60);
  ctx.font = `800 20px ${FONT}`; ctx.fillStyle = '#ffc93d'; ctx.fillText(net.code, tx, y + 82);
  if (net.qr) { ctx.font = `600 9px ${FONT}`; ctx.fillStyle = 'rgba(200,205,255,0.45)'; ctx.fillText('click QR to enlarge', x, y + size + 10); }
}
function drawBigQR() {
  ctx.fillStyle = 'rgba(4,4,12,0.85)'; ctx.fillRect(0, 0, W, H);
  const size = 380, x = W / 2 - size / 2, y = H / 2 - size / 2 - 30;
  if (net.qr) drawQR(net.qr, x, y, size);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `700 16px ${FONT}`; ctx.fillStyle = '#ffffff'; ctx.fillText(padURL().replace(/^https?:\/\//, ''), W / 2, y + size + 30);
  ctx.font = `800 30px ${FONT}`; ctx.fillStyle = '#ffc93d'; ctx.fillText(`ROOM ${net.code}`, W / 2, y + size + 66);
  ctx.font = `600 12px ${FONT}`; ctx.fillStyle = 'rgba(200,205,255,0.6)'; ctx.fillText('click anywhere to close', W / 2, y - 20);
  clickRects.push({ x: 0, y: 0, w: W, h: H, fn: () => { net.bigQR = false; } });
}
netConnect();

// ---------------- main loop ----------------
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  acc += Math.min(0.05, (now - last) / 1000); last = now;
  while (acc >= STEP) {
    const held = update(STEP);
    if (!held) for (const k in pressed) delete pressed[k];
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
